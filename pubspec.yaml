name: weather_forecast_app
description: A stunning weather forecast app with current conditions and multi-day forecast.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
